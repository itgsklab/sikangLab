<nav class="site-nav wrap" aria-label="{{ i18n "main_navigation" }}">
  {{ partial "site-brand.html" . }}
  <button class="menu-button" type="button" aria-label="{{ i18n "open_menu" }}" aria-expanded="false"><span></span><span></span><span></span></button>
  <div class="nav-links">
    {{ range site.Menus.main }}
      {{ if eq .Identifier "stack" }}
      <div class="nav-dropdown">
        <a href="{{ .URL | relLangURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ i18n "tech_stack" }} <span class="nav-chevron">⌄</span></a>
        <div class="dropdown-menu">
          <a href="{{ "stack/java/" | relLangURL }}"><small>01</small><span>Java</span></a>
          <a href="{{ "stack/python/" | relLangURL }}"><small>02</small><span>Python</span></a>
          <a href="{{ "stack/agent/" | relLangURL }}"><small>03</small><span>Agent</span></a>
          <a href="{{ "stack/work/" | relLangURL }}"><small>04</small><span>{{ i18n "personal_notes" }}</span></a>
        </div>
      </div>
      {{ else }}
      <a href="{{ .URL | relLangURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    {{ end }}
    {{ partial "more-menu.html" . }}
    {{ partial "nav-tools.html" . }}
  </div>
</nav>
