<nav class="site-nav wrap" aria-label="{{ i18n "main_navigation" }}">
  {{ partial "site-brand.html" . }}
  <button class="menu-button" type="button" aria-label="{{ i18n "open_menu" }}" aria-expanded="false"><span></span><span></span><span></span></button>
  <div class="nav-links">
    {{ range site.Menus.main }}
      <a class="section-nav-link" href="{{ site.Home.RelPermalink }}{{ .URL }}" data-home-section="{{ strings.TrimPrefix "#" .URL }}">{{ .Name }}</a>
    {{ end }}
    {{ partial "more-menu.html" . }}
    {{ partial "nav-tools.html" . }}
  </div>
</nav>
