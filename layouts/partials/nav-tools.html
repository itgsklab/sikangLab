<dialog class="search-dialog" data-search-prompt="{{ i18n "search_prompt" }}" data-searching="{{ i18n "searching" }}" data-untitled="{{ i18n "untitled_page" }}" data-no-results="{{ i18n "no_results" }}" data-unavailable="{{ i18n "search_unavailable" }}">
  <div class="search-head"><strong>{{ i18n "site_search" }}</strong><button class="search-close" type="button" aria-label="{{ i18n "close_search" }}">×</button></div>
  <label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.68 13.36L20.82 22 22 20.82l-5.64-5.64A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg><input type="search" placeholder="{{ i18n "search_placeholder" }}" autocomplete="off"></label>
  <div class="search-results"><p>{{ i18n "search_prompt" }}</p></div>
</dialog>
<script>
  (()=>{const dialog=document.querySelector('.search-dialog'),input=dialog?.querySelector('input'),results=dialog?.querySelector('.search-results'),copy=dialog?.dataset||{};let timer;
    document.querySelector('.search-button')?.addEventListener('click',()=>{dialog.showModal();setTimeout(()=>input.focus(),50)});
    dialog?.querySelector('.search-close')?.addEventListener('click',()=>dialog.close());
    dialog?.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    input?.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(async()=>{const q=input.value.trim();if(!q){results.innerHTML=`<p>${copy.searchPrompt}</p>`;return}results.innerHTML=`<p>${copy.searching}</p>`;try{const pagefind=await import('{{ "pagefind/pagefind.js" | relURL }}');await pagefind.init();const found=await pagefind.search(q);const items=await Promise.all(found.results.slice(0,8).map(r=>r.data()));results.innerHTML=items.length?items.map(item=>`<a href="${item.url}"><strong>${item.meta.title||copy.untitled}</strong><span>${item.excerpt||''}</span></a>`).join(''):`<p>${copy.noResults}</p>`}catch(e){results.innerHTML=`<p>${copy.unavailable}</p>`}},180)});
  })();
</script>
