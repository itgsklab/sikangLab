<a class="site-brand" href="{{ site.Home.Permalink }}" aria-label="{{ i18n "back_home" }}">
  {{- with resources.Get "media/site-icon-lab-v2.png" -}}
    {{- $brandIcon := .Resize "96x96" -}}
    <img class="brand-avatar" src="{{ $brandIcon.RelPermalink }}" width="40" height="40" alt="" decoding="async">
  {{- end -}}
  <span>Sikang Lab</span><b aria-hidden="true">|</b><small>{{ if eq site.Language.Lang "zh" }}全栈开发{{ else }}Full-stack{{ end }}</small>
</a>
