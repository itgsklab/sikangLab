<div class="language-switcher" aria-label="{{ i18n "language_switcher" }}">
  {{ range .AllTranslations }}
    <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}" {{ if eq .Language.Lang site.Language.Lang }}class="active" aria-current="page"{{ end }}>{{ if eq .Language.Lang "zh" }}中{{ else }}EN{{ end }}</a>
  {{ end }}
</div>
