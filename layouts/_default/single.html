{{ define "main" }}
<article class="article-page wrap-narrow">
  <a class="back-link" href="{{ .Parent.RelPermalink }}">← 返回{{ .Parent.Title }}</a>
  <header class="article-header">
    <div class="card-tags">{{ range .Params.tags }}<span>{{ . }}</span>{{ end }}</div>
    <h1>{{ .Title }}</h1>
    <div class="article-meta article-meta-interactive"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time><b>·</b><span>{{ .ReadingTime }} 分钟阅读</span><b>·</b>{{ partial "article-stats.html" . }}</div>
  </header>
  <div class="article-content">{{ .Content }}</div>
</article>
{{ end }}
