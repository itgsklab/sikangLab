{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default (cond (eq site.Language.Lang "zh") "文章配图" "Article illustration") -}}
{{- $caption := .Get "caption" -}}
{{- $href := .Get "href" -}}
{{- with resources.Get $src -}}
<figure class="article-inline-figure">
  {{- if $href }}<a href="{{ $href }}" target="_blank" rel="noopener" aria-label="{{ if eq site.Language.Lang "zh" }}查看配图来源{{ else }}View image source{{ end }}">{{ end -}}
    <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  {{- if $href }}</a>{{ end -}}
  {{- with $caption }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
{{- end -}}
